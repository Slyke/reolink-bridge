[alias]
logger-build = "build --manifest-path src/logger/Cargo.toml"
logger-test = "test --manifest-path src/logger/Cargo.toml"
logger-check = "clippy --manifest-path src/logger/Cargo.toml --all-targets -- -D warnings"
logger-fmt = "fmt --manifest-path src/logger/Cargo.toml"
logger-example = "run --manifest-path src/logger/Cargo.toml --example basic"
error-gen = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --error-file ./errors.json5"
error-add = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action add --error-file ./errors.json5"
error-edit = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action edit --error-file ./errors.json5"
error-delete = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action delete --error-file ./errors.json5"
error-rm = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action delete --error-file ./errors.json5"
error-get = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action get --error-file ./errors.json5"
error-search = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action search --error-file ./errors.json5"
error-list = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action all --error-file ./errors.json5"
error-validate = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action validate --error-file ./errors.json5"
