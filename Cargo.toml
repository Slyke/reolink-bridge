[package]
name = "reolink-mqtt-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
cfb-mode = "0.8"
chrono = { version = "0.4", features = ["serde"] }
digest_auth = "0.3"
futures-util = "0.3"
json5 = "1.3.1"
lz4_flex = { version = "0.13", default-features = false, features = ["std", "frame", "safe-decode", "safe-encode"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
retina = "0.4"
roxmltree = "0.21"
rumqttc = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
styleguide-logger = { path = "src/logger" }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
